<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פיצריית השברים</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- איורים משותפים: תוספות, מרקמים ומעברי צבע (לא מוצגים בעצמם) -->
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="givenPat" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#bcdcff" fill-opacity="0.78"/>
      <rect width="6" height="12" fill="#3f7fd6" fill-opacity="0.75"/>
    </pattern>
    <pattern id="guidePat" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="12" height="12" fill="#ffffff" fill-opacity="0.18"/>
      <rect width="5" height="12" fill="#2f9e6b" fill-opacity="0.55"/>
    </pattern>
    <radialGradient id="cheeseGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#ffc233"/>
    </radialGradient>

    <symbol id="t-mush" viewBox="0 0 40 40">
      <path d="M7 22 C7 9 33 9 33 22 Z" fill="#c68a5c" stroke="#5a3418" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M16 22 L16 32 Q20 35 24 32 L24 22 Z" fill="#f4e7d2" stroke="#5a3418" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="14" cy="17" r="2" fill="#f4e7d2"/><circle cx="22" cy="14.5" r="2" fill="#f4e7d2"/><circle cx="27" cy="18.5" r="1.6" fill="#f4e7d2"/>
    </symbol>
    <symbol id="t-olive" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="13" fill="#2b2b33" stroke="#0e0e12" stroke-width="2"/>
      <circle cx="20" cy="20" r="5.2" fill="#ffd966" stroke="#0e0e12" stroke-width="1.6"/>
      <path d="M11 14 Q14 9 19 8.5" stroke="#8d8d9c" stroke-width="2" fill="none" stroke-linecap="round"/>
    </symbol>
    <symbol id="t-tomato" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="13.5" fill="#e53935" stroke="#7a1410" stroke-width="2.2"/>
      <path d="M20 20 L20 8 M20 20 L31 25 M20 20 L9 25" stroke="#ff9a8f" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="20" cy="20" r="3" fill="#ffb3a8"/>
    </symbol>
    <symbol id="t-corn" viewBox="0 0 40 40">
      <ellipse cx="13" cy="23" rx="5.5" ry="7.5" fill="#ffe14d" stroke="#a87f00" stroke-width="2" transform="rotate(-20 13 23)"/>
      <ellipse cx="27" cy="23" rx="5.5" ry="7.5" fill="#ffe14d" stroke="#a87f00" stroke-width="2" transform="rotate(20 27 23)"/>
      <ellipse cx="20" cy="15" rx="5.5" ry="7.5" fill="#fff08a" stroke="#a87f00" stroke-width="2"/>
    </symbol>
    <symbol id="t-onion" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="13" fill="none" stroke="#7b3f8c" stroke-width="3.2"/>
      <circle cx="20" cy="20" r="7.5" fill="none" stroke="#c58fd1" stroke-width="3"/>
      <circle cx="20" cy="20" r="2.2" fill="#e7c9ee"/>
    </symbol>
    <symbol id="t-cheese" viewBox="0 0 40 40">
      <path d="M5 29 L32 12 L36 29 Z" fill="#fff6c2" stroke="#a07d00" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="25" cy="22" r="2.6" fill="#f2cf4a" stroke="#a07d00" stroke-width="1.2"/>
      <circle cx="16" cy="25.5" r="1.8" fill="#f2cf4a" stroke="#a07d00" stroke-width="1.2"/>
    </symbol>
    <symbol id="t-pepper" viewBox="0 0 40 40">
      <path d="M6 22 C6 9 34 9 34 22 C34 28 28 31 24 28 C22 26 18 26 16 28 C12 31 6 28 6 22Z" fill="#5cb85c" stroke="#1f5a1f" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M14 14 C18 11 24 11 28 14" stroke="#c4ecc4" stroke-width="2" fill="none" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div id="app">
  <section id="screen-home" class="screen"></section>
  <section id="screen-stage" class="screen" hidden></section>
  <section id="screen-lesson" class="screen" hidden></section>
  <section id="screen-order" class="screen" hidden></section>
  <section id="screen-done" class="screen" hidden></section>
</div>

<div id="fx" aria-hidden="true"></div>
<div id="toast" role="status" hidden></div>

<div id="settings" role="dialog" aria-modal="true" aria-labelledby="setTitle" hidden>
  <div class="set-card">
    <h2 id="setTitle">הגדרות</h2>
    <p class="set-note">כל הנושאים וכל הרמות פתוחים. אפשר להתחיל מכל מקום.</p>
    <div class="set-row"><button type="button" class="btn" id="setReset">🗑 איפוס ההתקדמות</button></div>
    <p id="resetMsg" class="set-note" aria-live="polite"></p>
    <button type="button" class="btn primary big" id="setClose">סגירה</button>
  </div>
</div>

<script src="js/pizza.js"></script>
<script src="js/chars.js"></script>
<script src="js/gen.js"></script>
<script src="js/t1.js"></script>
<script src="js/t2.js"></script>
<script src="js/t3.js"></script>
<script src="js/t4.js"></script>
<script src="js/t5.js"></script>
<script src="js/t6.js"></script>
<script src="js/t7.js"></script>
<script src="js/t8.js"></script>
<script src="js/t9.js"></script>
<script src="js/t10.js"></script>
<script src="js/t11.js"></script>
<script src="js/summary.js"></script>
<script src="js/game.js"></script>
</body>
</html>
